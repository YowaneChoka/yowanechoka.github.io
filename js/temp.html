<script>
    console.log(" JavaScript OK");

    const input = [1, 2, 3, 4];
    //1234
    //123
    //12
    //1

    const fn = (input) => {
        let out = [];
        for (let i = input.length - 1; i >= 0; i--) {
            let out1 = [];
            for (let j = 0; j <= i; j++) {
                out1.push(input[j]);
                //console.log(input[j]);
            }
            out.push(out1);
        }
        return out;
    };

    console.log(fn(input));
</script>

<body>
    Hello World!
</body>
